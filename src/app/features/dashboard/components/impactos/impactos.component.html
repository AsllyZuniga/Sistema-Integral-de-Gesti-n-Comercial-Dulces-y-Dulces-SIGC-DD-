<div class="chart-box dynamic-panel">
  <h3>Análisis de Impactos</h3>

  <div class="tabs">
    @for (view of impactosViews; track view.key) {
      <button [class.active]="activeImpactosView === view.key" (click)="setImpactosView(view.key)">
        {{ view.label }}
      </button>
    }
  </div>

  <div class="dynamic-content">
    @switch (activeImpactosView) {
      @case ('vendedor') {
        <app-ventas-tabla-grafica
          [columns]="vendedorColumns"
          [data]="vendedorData"
          [chartData]="vendedorChartData"
          chartId="chart-impactos-vendedor"
          chartType="bar"
          chartLabel="Impactos"
          chartTitle="Impactos por Vendedor"
          [showLegend]="false"
        ></app-ventas-tabla-grafica>
      }

      @case ('proveedor') {
        <app-ventas-tabla-grafica
          [columns]="proveedorColumns"
          [data]="proveedorData"
          [chartData]="proveedorChartData"
          chartId="chart-impactos-proveedor"
          chartType="bar"
          chartLabel="Impactos"
          chartTitle="Impactos por Proveedor"
          [showLegend]="false"
        ></app-ventas-tabla-grafica>
      }

      @case ('categoria') {
        <app-ventas-tabla-grafica
          [columns]="categoriaColumns"
          [data]="categoriaData"
          [chartData]="categoriaChartData"
          chartId="chart-impactos-categoria"
          chartType="bar"
          chartLabel="Impactos"
          chartTitle="Impactos por Categoría"
          [showLegend]="false"
        ></app-ventas-tabla-grafica>
      }
    }
  </div>
</div>
