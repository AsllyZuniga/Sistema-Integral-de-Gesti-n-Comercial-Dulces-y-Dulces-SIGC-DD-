<div class="chart-box dynamic-panel">
  <h3>Análisis de Impactos</h3>

  <div class="tabs">
    @for (view of impactosViews; track view.key) {
      <button [class.active]="activeImpactosView === view.key" (click)="setImpactosView(view.key)">
        {{ view.label }}
      </button>
    }
  </div>

  <div class="dynamic-content">
    @switch (activeImpactosView) {
      @case ('vendedor') {
        <app-ventas-tabla-grafica
          [columns]="vendedorColumns"
          [data]="vendedorData"
          [chartData]="vendedorChartData"
          chartId="chart-impactos-vendedor"
          chartType="bar"
          chartLabel="Top 15 Vendedores"
          chartTitle="Top 15 Vendedores por Impactos"
          kpiLabel="Suma top 15"
          [kpiValue]="totalTopVendedoresLabel"
          [showLegend]="false"
          [showTotals]="true"
          [totalCuotaLabel]="totalCuotaVendedoresLabel"
          [totalAcumuladoLabel]="totalAcumuladoVendedoresLabel"
        ></app-ventas-tabla-grafica>
      }

      @case ('proveedor') {
        <app-ventas-tabla-grafica
          [columns]="proveedorColumns"
          [data]="proveedorData"
          [chartData]="proveedorChartData"
          chartId="chart-impactos-proveedor"
          chartType="bar"
          chartLabel="Top 15 Proveedores"
          chartTitle="Top 15 Proveedores por Impactos"
          kpiLabel="Suma top 15"
          [kpiValue]="totalTopProveedoresLabel"
          [showLegend]="false"
          [showTotals]="true"
          [totalCuotaLabel]="totalCuotaProveedoresLabel"
          [totalAcumuladoLabel]="totalAcumuladoProveedoresLabel"
        ></app-ventas-tabla-grafica>
      }

      @case ('categoria') {
        <app-ventas-tabla-grafica
          [columns]="categoriaColumns"
          [data]="categoriaData"
          [chartData]="categoriaChartData"
          chartId="chart-impactos-categoria"
          chartType="bar"
          chartLabel="Top 15 Categorías"
          chartTitle="Top 15 Categorías por Impactos"
          kpiLabel="Suma top 15"
          [kpiValue]="totalTopCategoriasLabel"
          [showLegend]="false"
          [showTotals]="true"
          [totalCuotaLabel]="totalCuotaCategoriasLabel"
          [totalAcumuladoLabel]="totalAcumuladoCategoriasLabel"
        ></app-ventas-tabla-grafica>
      }
    }
  </div>
</div>
