<div class="layout">
  <app-sidebar (toggle)="onToggleSidebar($event)"></app-sidebar>

  <div class="main" [class.expanded]="isSidebarCollapsed">
    <app-topbar
      textoIntro="Bienvenido,"
      [titulo]="vendedor?.nombre || 'Dashboard'"
      subtitulo="Sistema de Control de Ventas · Dulces y Dulces"
      (menuClick)="toggleMenuMovil()"
      (logoutClick)="logout()"
    ></app-topbar>

    <app-toast
      mensaje="Ventas por Canal disponible en el Análisis de Ventas"
      fechaLimite="2026-08-22"
    ></app-toast>

    <div class="cuota-selector-row">
      <app-cuotas-cumplimiento
        [tipoCuota]="tipoCuota"
        [ocultarDiaria]="activeAnalisisView === 'impactos'"
        (tipoCuotaChange)="onCambiarTipoCuota($event)"
      ></app-cuotas-cumplimiento>
    </div>

    <section class="filters">
      <app-filters
        [proveedores]="proveedoresList"
        [categorias]="categoriasList"
        [ciudades]="ciudadesList"
        [canales]="canalesList"
        [lineas]="lineasList"
        [vendedores]="mostrarFiltroVendedorPorRol ? vendedoresList : []"
        [mostrarFiltroVendedor]="mostrarFiltroVendedorPorRol"
        [mostrarFiltroCiudad]="mostrarFiltroCiudad"
        [mostrarFiltroCanal]="mostrarFiltroCanal"
        [filtrosActivos]="filtrosActivos"
        (apply)="onAplicarFiltros($event)"
        (filterChange)="onFiltroChange($event)"
      ></app-filters>
    </section>

    @if (esAdmin) {
      <app-administrador-dashboard
        [tipoCuota]="tipoCuota"
        [vistaActiva]="activeAnalisisView"
        [filtrosActivos]="filtrosActivos"
      ></app-administrador-dashboard>
    }

    @if (esSupervisor) {
      <app-supervisor-dashboard
        [tipoCuota]="tipoCuota"
        [vista]="activeSupervisorView"
        [filtrosActivos]="filtrosActivos"
      ></app-supervisor-dashboard>
    }

    @if (rolId === 3) {
      <section class="kpis">
        <app-card
          [title]="labelVentaAcum"
          [value]="
            activeAnalisisView === 'impactos'
              ? ventaAcumImpactos ?? 0
              : totalesVendedor?.ventaAcum ?? 0
          "
          [isCurrency]="activeAnalisisView !== 'impactos'"
        ></app-card>
        <app-card
          [title]="labelCuota"
          [value]="
            activeAnalisisView === 'impactos'
              ? cuotaImpactos ?? 0
              : cuotaVistaVendedor ??
                (tipoCuota === 'diaria'
                  ? (totalesVendedor?.cuotaDiaria ?? totalesVendedor?.cuotaMes ?? 0)
                  : tipoCuota === 'semanal'
                    ? (totalesVendedor?.cuotaSemana ?? totalesVendedor?.cuotaMes ?? 0)
                    : (totalesVendedor?.cuotaMes ?? 0))
          "
          [isCurrency]="activeAnalisisView !== 'impactos'"
        ></app-card>
        <app-card
          title="Cumplimiento"
          [value]="
            activeAnalisisView === 'impactos'
              ? porcCumpImpactos ?? 0
              : totalesVendedor?.porcCump ?? 0
          "
        ></app-card>
        <app-card
          title="Proyección"
          [value]="
            activeAnalisisView === 'impactos'
              ? proyeccionImpactos ?? 0
              : totalesVendedor?.proyeccionVenta ?? 0
          "
          [isCurrency]="activeAnalisisView !== 'impactos'"
        ></app-card>
      </section>

      <section class="charts">
        @if (activeAnalisisView === 'impactos') {
          <app-impactos
            [filtrosActivos]="filtrosActivos"
            (resumenCambio)="onResumenCambioImpactos($event)"
          ></app-impactos>
        } @else {
          <app-ventas
            [codigoVendedor]="codigoVendedor"
            [modoAdmin]="false"
            [filtros]="filtrosActivos"
            [tipoCuota]="tipoCuota"
          ></app-ventas>
        }
      </section>
    }
  </div>
</div>
